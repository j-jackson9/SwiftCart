<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftCart</title>
    <link href="header.css" rel="stylesheet"/>
    <link href="category-select.css" rel="stylesheet"/>
    <link href="slider.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;700&display=swap" rel="stylesheet">

</head>
<body>
    <header> 
        <a href="index.html">
            <button class="logo">
                <i class="fa-sharp fa-solid fa-s"></i><i class="fa-sharp fa-solid fa-c"></i>
                <i class="fa-solid fa-truck-fast"></i>
            </button> 
        </a>
        <span class="title">
            <span class="fast-1">&#9889</span>
            <span class="swift">SwiftCart</span>
            <span class="fast-2">&#9889</span>
          </span>
          
        <a href="cart.html">
            <div class="cart">
                <i class="fa-solid fa-cart-shopping"></i>
                <p class="cart-indicator">Cart</p>
                <button class="cart-badge">0</button>
            </div>
        </a>
    </header>

    <div class="selections">
        <ul class="category">
            <li><a href="toys.html">Toys</a></li>
            <li><a href="sportsoutdoors.html">Sports & Outdoors</a></li>
            <li><a href="gym.html">Gym</a></li>
            <li><a href="">Home & Kitchen</a></li>
            <li><a href="">Tech</a></li>
        </ul>   
    </div>

    <select class="category-select" onchange="if(this.value) window.location.href=this.value">
        <option value="">Select a category</option>
        <option value="toys.html">Toys</option>
        <option value="sportsoutdoors.html">Sports & Outdoors</option>
        <option value="gym.html">Gym</option>
        <option value="#">Home & Kitchen</option>
        <option value="#">Tech</option>
    </select>

    <h1 class="category-title">Gym</h1>
    </h1>
    
    <div class="carousel">
        <div class="carousel-slider">
            <div class="item">
                <img src="dumbell shelf.jpg">
                <h3 class="name">Dumbell Shelf</h3>
                <h1 class="rating">★★★★☆</h1>
                <p class="price">$100.99</p> 
                <div class="input-select">
                    <input type="number" class="quantity" name="quantity" min="1" max="4" placeholder="Quantity">
                    <br><br>
                </div>
                <button class="add-to-cart">Add to cart</button>
            </div>
            <div class="item">
                <img src="exercise bike.jpg">
                <h3 class="name">Exercise Bike</h3>
                <h1 class="rating">★★★★★</h1>
                <p class="price">$140.99</p> 
                <div class="input-select">
                    <input type="number" class="quantity" name="quantity" min="1" max="4" placeholder="Quantity">
                    <br><br>
                </div>
                <button class="add-to-cart">Add to cart</button>
            </div>
            <div class="item">
                <img src="exericse ball.jpg">
                <h3 class="name">Exercise Ball</h3>
                <h1 class="rating">★★★★★</h1>
                <p class="price">$15.99</p> 
                <div class="input-select">
                    <input type="number" class="quantity" name="quantity" min="1" max="4" placeholder="Quantity">
                    <br><br>
                </div>
                <button class="add-to-cart">Add to cart</button>
            </div>
            <div class="item">
                <img src="treadmill.jpg">
                <h3 class="name">Treadmill</h3>
                <h1 class="rating">★★★★☆</h1>
                <p class="price">$200.99</p>
                <div class="input-select">
                    <input type="number" class="quantity" name="quantity" min="1" max="4" placeholder="Quantity">
                    <br><br>
                </div> 
                <button class="add-to-cart">Add to cart</button>
            </div>
            <div class="item">
                <img src="yoga mat.jpg">
                <h3 class="name">Yoga Mat</h3>
                <h1 class="rating">★★★★☆</h1>
                <p class="price">$50.99</p>
                <div class="input-select">
                    <input type="number" class="quantity" name="quantity" min="1" max="4" placeholder="Quantity">
                    <br><br>
                </div> 
                <button class="add-to-cart">Add to cart</button>
            </div>
         </div>
    </div>

    <script src="index.js">
     
    </script>
    <script src="https://kit.fontawesome.com/71330fe78e.js" crossorigin="anonymous"></script>
</body>
</html>
