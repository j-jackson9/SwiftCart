<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftCart</title>
    <link href="header.css" rel="stylesheet"/>
    <link href="category-select.css" rel="stylesheet"/>
    <link href="slider.css" rel="stylesheet"/>
    <link href="about-contact-footer.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;700&display=swap" rel="stylesheet">

</head>
<body>
    <header> 
        <a href="index.html">
            <button class="logo">
                <i class="fa-sharp fa-solid fa-s"></i><i class="fa-sharp fa-solid fa-c"></i>
                <i class="fa-solid fa-truck-fast"></i>
            </button> 
        </a>
        <span class="title">
            <span class="fast-1">&#9889</span>
            <span class="swift">SwiftCart</span>
            <span class="fast-2">&#9889</span>
          </span>
          
        <a href="cart.html">
            <div class="cart">
                <i class="fa-solid fa-cart-shopping"></i>
                <p class="cart-indicator">Cart</p>
                <button class="cart-badge">0</button>
            </div>
        </a>
    </header>

    <div class="selections">
        <ul class="category">
            <li><a href="toys.html">Toys</a></li>
            <li><a href="sportsoutdoors.html">Sports & Outdoors</a></li>
            <li><a href="gym.html">Gym</a></li>
            <li><a href="homekitchen.html">Home & Kitchen</a></li>
            <li><a href="techgadgets.html">Tech</a></li>
        </ul>   
    </div>

    <select class="category-select" onchange="if(this.value) window.location.href=this.value">
        <option value="">Select a category</option>
        <option value="toys.html">Toys</option>
        <option value="sportsoutdoors.html">Sports & Outdoors</option>
        <option value="gym.html">Gym Equipment</option>
        <option value="homekitchen.html">Home & Kitchen</option>
        <option value="techgadgets.html">Tech & Gadgets</option>
    </select>

    <h1 class="category-title">Tech</h1>
    
    <div class="carousel">
        <div class="carousel-slider">
            <div class="item">
                <img src="gaming pc.jpg">
                <h3 class="name">Gaming PC</h3>
                <h1 class="rating">★★★★☆</h1>
                <p class="price">$800.99</p> 
                <div class="input-select">
                    <input type="number" class="quantity" name="quantity" min="1" max="4" placeholder="Quantity">
                    <br><br>
                </div>
                <button class="add-to-cart">Add to cart</button>
            </div>
            <div class="item">
                <img src="nintendo switch.jpg">
                <h3 class="name">Nintendo Switch</h3>
                <h1 class="rating">★★★★★</h1>
                <p class="price">$349.99</p> 
                <div class="input-select">
                    <input type="number" class="quantity" name="quantity" min="1" max="4" placeholder="Quantity">
                    <br><br>
                </div>
                <button class="add-to-cart">Add to cart</button>
            </div>
            <div class="item">
                <img src="vr headset.webp">
                <h3 class="name">VR Headset</h3>
                <h1 class="rating">★★★★★</h1>
                <p class="price">$120.99</p> 
                <div class="input-select">
                    <input type="number" class="quantity" name="quantity" min="1" max="4" placeholder="Quantity">
                    <br><br>
                </div>
                <button class="add-to-cart">Add to cart</button>
            </div>
            <div class="item">
                <img src="air pods pro 2.jpg">
                <h3 class="name">Air Pods Pro 2</h3>
                <h1 class="rating">★★★★☆</h1>
                <p class="price">$107.99</p>
                <div class="input-select">
                    <input type="number" class="quantity" name="quantity" min="1" max="4" placeholder="Quantity">
                    <br><br>
                </div> 
                <button class="add-to-cart">Add to cart</button>
            </div>
            <div class="item">
                <img src="ps5.png">
                <h3 class="name">PS5</h3>
                <h1 class="rating">★★★★☆</h1>
                <p class="price">$449.99</p>
                <div class="input-select">
                    <input type="number" class="quantity" name="quantity" min="1" max="4" placeholder="Quantity">
                    <br><br>
                </div> 
                <button class="add-to-cart">Add to cart</button>
            </div>
         </div>
    </div>

<div class="footer">
    <p>&copy; 2025 SwiftCart. All rights reserved.</p>
</div>

    <script src="index.js">
     
    </script>
    <script src="https://kit.fontawesome.com/71330fe78e.js" crossorigin="anonymous"></script>
</body>
</html>
