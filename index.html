<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftCart</title>
    <link href="header.css" rel="stylesheet"/>
    <link href="category-select.css" rel="stylesheet"/>
    <link href="slider.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;700&display=swap" rel="stylesheet">

</head>
<body>
    <header> 
        <a href="https://chatgpt.com/">
            <button class="logo">
                <i class="fa-sharp fa-solid fa-s"></i><i class="fa-sharp fa-solid fa-c"></i>
                <i class="fa-solid fa-truck-fast"></i>
            </button>
        </a>
        <span class="title">&#9889SwiftCart&#9889</span>
        <a href="https://chatgpt.com/">
            <div class="cart">
                <i class="fa-solid fa-cart-shopping"></i>
                <p class="cart-indicator">Cart</p>
                <button class="cart-badge">0</button>
            </div>
        </a>
    </header>

    <div class="selections">
        <ul class="category">
            <li><a href="">Toys</a></li>
            <li><a href="">Sports & Outdoors</a></li>
            <li><a href="">Gym Equipment</a></li>
            <li><a href="">Home & Kitchen</a></li>
            <li><a href="">Tech & Gadgets</a></li>
            <li><a href="">Fitness & Health</a></li>
        </ul>   
    </div>

    <h1>New Arrivals!</h1>

    <button class="left-arrow"><i class="fa-solid fa-arrow-left"></i></button>
    <button class="right-arrow"><i class="fa-solid fa-arrow-right"></i></button>
    <div class="carousel">
        <div class="carousel-slider">
            <div class="item">
                <img src="bencg.jpg">
                <h3 class="name">Workout Machine</h3>
                <h1 class="rating">★★★★☆</h1>
                <p class="price">$289.99</p> 
                <button class="add-to-cart">Add to cart</button>
            </div>
            <div class="item">
                <img src="hoop.jpg">
                <h3 class="name">Basketball Hoop</h3>
                <h1 class="rating">★★★★★</h1>
                <p class="price">$149.99</p> 
                <button class="add-to-cart">Add to cart</button>
            </div>
            <div class="item">
                <img src="keyboard.jpg">
                <h3 class="name">RGB Keyboard</h3>
                <h1 class="rating">★★★★★</h1>
                <p class="price">$39.99</p> 
                <button class="add-to-cart">Add to cart</button>
            </div>
            <div class="item">
                <img src="kids toy.jpg">
                <h3 class="name">Kids Gas Pump</h3>
                <h1 class="rating">★★★★☆</h1>
                <p class="price">$19.99</p> 
                <button class="add-to-cart">Add to cart</button>
            </div>
            <div class="item">
                <img src="massage.jpg">
                <h3 class="name">Leg Massager</h3>
                <h1 class="rating">★★★★☆</h1>
                <p class="price">$59.99</p> 
                <button class="add-to-cart">Add to cart</button>
        </div>
    </div>
    

    <script src="index.js"></script>
    <script src="https://kit.fontawesome.com/71330fe78e.js" crossorigin="anonymous"></script>
</body>
</html>
